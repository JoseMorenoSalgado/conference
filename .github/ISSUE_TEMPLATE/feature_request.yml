name: Feature request
description: Suggest an improvement to mod_conference
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: Describe the workflow or limitation you want to improve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Moodle compatibility considerations
      description: Mention relevant Moodle versions, APIs, themes, accessibility, or privacy constraints.
